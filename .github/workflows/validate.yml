name: Current source and materials
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-validation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install tool test dependencies
        run: python -m pip install -r tools/requirements-test.txt
      - name: Validate current source and materials
        run: python -B tools/validate_repository.py
      - name: Test build and model preparation tools
        run: python -B -m unittest discover -s tests -v
